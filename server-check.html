<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sous Server Check</title>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4efe6;color:#1f1a12;margin:0;padding:24px;}
  main{max-width:760px;margin:0 auto;}
  h1{font-size:26px;margin:0 0 8px;}
  p{color:#6f6254;line-height:1.45;}
  pre{white-space:pre-wrap;background:#1f1a12;color:#f4efe6;border-radius:10px;padding:14px;overflow:auto;}
  .ok{border-left:5px solid #5c8a1f;background:#fff;padding:12px;border-radius:10px;margin-top:16px;}
  .bad{border-left:5px solid #b3261e;background:#fff;padding:12px;border-radius:10px;margin-top:16px;}
</style>
</head>
<body>
<main>
  <h1>Sous Server Check</h1>
  <p>
    Open this through <code>http://localhost:3001/server-check.html</code>.
    If this page is missing or fails, your server is not serving the updated Documents workspace.
  </p>
  <div id="result"></div>
</main>

<script>window.SOUS_SKIP_INIT=true;</script>
<script src="js/storage.js?v=10"></script>
<script src="js/food-data.js?v=11"></script>
<script src="js/parser.js?v=11"></script>
<script src="js/app.js?v=12"></script>
<script>
var meal=[];
function speak(){}
function showToast(){}

function runCheck(){
  const checks=[];
  checks.push(['page marker','server-check-2026-05-17']);
  checks.push(['location',location.href]);
  checks.push(['parser substitution helper',typeof resolveReplacementFood]);
  checks.push(['usual meal finder',typeof findUsualMealByCommand]);
  checks.push(['ai escalation gate',typeof aiEscalationReason]);
  checks.push(['local resolver',typeof resolveIngredientLocally]);
  const cmd=parseText('bread instead of rice')[0];
  const usualCmd=parseText('usual oats')[0];
  checks.push(['parsed substitution',JSON.stringify(cmd)]);
  checks.push(['usual command escalation',aiEscalationReason('usual oats',[usualCmd])]);

  const ok=typeof resolveReplacementFood==='function'
    && typeof aiEscalationReason==='function'
    && cmd
    && cmd.command==='changeFood'
    && cmd.target==='rice'
    && cmd.replacement==='bread'
    && aiEscalationReason('usual oats',[usualCmd])==='none';

  document.getElementById('result').innerHTML=
    `<div class="${ok?'ok':'bad'}"><strong>${ok?'PASS':'FAIL'}</strong><pre>${checks.map(([k,v])=>`${k}: ${v}`).join('\n')}</pre></div>`;
}

try{runCheck();}
catch(error){
  document.getElementById('result').innerHTML=`<div class="bad"><strong>ERROR</strong><pre>${error.stack||error}</pre></div>`;
}
</script>
</body>
</html>
